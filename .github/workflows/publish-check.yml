name: Publish dry-run (auth check)

# Manual safety check: verifies the NPM_TOKEN secret authenticates and shows
# exactly what would be published — without publishing anything.
# Run it from the Actions tab → "Publish dry-run (auth check)" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Authenticate (verifies NPM_TOKEN works)
        run: |
          echo "Publishing as: $(npm whoami)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish dry-run (nothing is uploaded)
        run: npm publish --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
